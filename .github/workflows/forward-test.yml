# Forward tests, every Monday on fresh OANDA data:
# F1 (gse_research/forward.py, results/F1/rule.json): flipped-level touches since 2026-10-13 against random levels;
# F2 (gse_research/forward_setups.py, results/F2/rule.json): paper trades of the best S5 settings since 2026-10-23.
# The reports are shown on the run's summary page and kept as the "f1-report" and "f2-report"
# artifacts. Nothing is committed or written to a database.
name: forward-test
run-name: "forward test F1"

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
      OANDA_ENV: ${{ secrets.OANDA_ENV }}
      PYTHONUNBUFFERED: "1"
      PYTHONWARNINGS: ignore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore market data
        uses: actions/cache/restore@v4
        with:
          path: data/XAU_USD_M15.parquet
          key: oanda-m15-${{ github.run_id }}
          restore-keys: oanda-m15-
      - name: Update market data (OANDA, only the missing candles)
        run: python -m gse_research download
      - name: Save market data
        uses: actions/cache/save@v4
        with:
          path: data/XAU_USD_M15.parquet
          key: oanda-m15-${{ github.run_id }}
      - name: Forward test F1
        run: python -m gse_research forward-test --out out/F1
      - name: Show the report on the summary page
        run: cat out/F1/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: f1-report
          path: out/F1/
          retention-days: 90
      - name: Forward test F2
        run: python -m gse_research forward-setups --out out/F2
      - name: Show the F2 report on the summary page
        run: cat out/F2/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: f2-report
          path: out/F2/
          retention-days: 90
