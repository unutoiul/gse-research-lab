# Runs one research job queued from the website admin (Research tab), or every queued job.
# The admin dispatches this workflow with the job's id. Results go to the research tables
# through RESEARCH_DATABASE_URL, a login limited to those tables.
name: research-job
run-name: "research job ${{ inputs.job_id || 'queue' }}"

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "research_jobs id (leave empty to run every queued job)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      RESEARCH_DATABASE_URL: ${{ secrets.RESEARCH_DATABASE_URL }}
      OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
      OANDA_ENV: ${{ secrets.OANDA_ENV }}
      JOB_ID: ${{ inputs.job_id }}
      PYTHONUNBUFFERED: "1"
      PYTHONWARNINGS: ignore
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Restore market data
        uses: actions/cache/restore@v4
        with:
          path: data/XAU_USD_M15.parquet
          key: oanda-m15-${{ github.run_id }}
          restore-keys: oanda-m15-

      - name: Update market data (OANDA, only the missing candles)
        run: python -m gse_research download

      - name: Save market data
        uses: actions/cache/save@v4
        with:
          path: data/XAU_USD_M15.parquet
          key: oanda-m15-${{ github.run_id }}

      # Below the job limit, so the next step still runs when a long search hits it.
      - name: Run the job
        timeout-minutes: 330
        run: |
          if [ -z "$JOB_ID" ]; then
            python -m gse_research run-queue
          elif [[ "$JOB_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            python -m gse_research run-job "$JOB_ID"
          else
            echo "job_id is not a UUID" && exit 1
          fi

      # The job's files (a search's full trials, its report): kept for 30 days, also when a later step fails.
      - name: Keep the job's files
        if: always() && env.JOB_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: research-job-${{ env.JOB_ID }}
          path: out/jobs/${{ env.JOB_ID }}/
          if-no-files-found: ignore
          retention-days: 30

      # A run that dies on its own (time limit, crash, setup error) cannot mark its job,
      # which would otherwise show as running in the admin forever.
      - name: Report a run that stopped early
        if: (failure() || cancelled()) && env.JOB_ID != ''
        run: python -m gse_research abandon-job "$JOB_ID" "The GitHub run stopped before the job finished (time limit, crash or setup error). Open the log."
